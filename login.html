<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Concept Academy Login | ConceptOS™</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Reuse existing styles -->
  <link rel="stylesheet" href="main.css" />

  <style>
    /* Login-only safe styles (isolated) */
    .login-wrapper{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:
        radial-gradient(circle at 20% 20%, #14202e, transparent 40%),
        radial-gradient(circle at 80% 80%, #0f2a1f, transparent 45%),
        #0b0f14;
    }

    .login-card{
      width:100%;
      max-width:380px;
      background:linear-gradient(180deg,#101b2a,#0c1624);
      padding:36px;
      border-radius:20px;
      text-align:center;
      box-shadow:0 0 40px rgba(87,255,143,0.15);
    }

    .login-card h1{
      font-size:28px;
      margin-bottom:6px;
    }

    .login-card p{
      color:#cfd8e3;
      margin-bottom:26px;
    }

    .login-card input{
      width:100%;
      margin-bottom:14px;
    }

    .login-card button{
      width:100%;
      margin-top:10px;
    }

    .login-footer{
      margin-top:20px;
      font-size:14px;
      color:#9fb0c3;
    }

    .login-footer span{
      color:#57ff8f;
    }
  </style>
</head>

<body>

<div class="login-wrapper">
  <div class="login-card">

    <p class="hero-eyebrow">ConceptOS™ Secure Access</p>

    <h1>Student Login</h1>
    <p>Access your learning system</p>

    <form>
      <input type="text" placeholder="Registered Mobile / Email" required />
      <input type="password" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>

    <div class="login-footer">
      Powered by <span>ConceptOS™</span><br/>
      Classes 9–12 · All Boards
    </div>

  </div>
</div>

</body>
</html>
