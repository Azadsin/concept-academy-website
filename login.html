<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ConceptOS™ Secure Access</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- LOGIN CSS ONLY -->
  <link rel="stylesheet" href="assets/css/login.css" />
</head>
<body>

  <div class="login-wrapper">

    <div class="login-card">
      <div class="login-header">
        <p class="system-label">ConceptOS™ Secure Access</p>
        <h1>Unified Login</h1>
        <p class="subtitle">
          Single access point for Students, Faculty, and Administration
        </p>
      </div>

      <form class="login-form">
        <input
          type="text"
          placeholder="Registered Email or Mobile"
          required
        />

        <input
          type="password"
          placeholder="Password"
          required
        />

        <button type="submit" class="login-btn">
          Login
        </button>
      </form>

      <div class="login-footer">
        <p>Role-based access · Automatic redirection</p>
        <p class="powered">
          Powered by <span>ConceptOS™</span>
        </p>
        <p class="boards">Classes 9–12 · All Boards</p>
      </div>
    </div>

  </div>

  <!-- OPTIONAL JS (FUTURE READY) -->
  <script src="assets/js/login.js"></script>
</body>
</html>
